name: Evidence Ledger CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "latest"
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev --extra aws

      - name: Run tests
        run: uv run pytest

      - name: Validate AWS template
        run: sam validate --template-file infra/template.yaml --lint

      - name: Build AWS package
        run: sam build --template-file infra/template.yaml --build-dir .aws-sam/build
