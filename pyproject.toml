[project]
name = "evidence-ledger"
version = "0.1.0"
description = "A synthetic, auditable evidence pipeline with local and AWS execution paths."
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [{name = "Julie Elkins"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-timeout>=2.3",
]
aws = [
  "boto3>=1.35",
  "botocore[crt]>=1.35",
]

[project.scripts]
evidence-ledger = "evidence_ledger.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
timeout_method = "thread"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
