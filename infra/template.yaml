AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Disposable Evidence Ledger synthetic demo infrastructure.

Parameters:
  RetentionDays:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 7
    Description: Short governance retention for the synthetic demo only.

Resources:
  EvidenceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub evidence-ledger-${AWS::AccountId}-${AWS::Region}-${AWS::StackName}
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: GOVERNANCE
            Days: !Ref RetentionDays
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  EvidenceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EvidenceBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt EvidenceBucket.Arn
              - !Sub "${EvidenceBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  CustodyTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: matter_id
          AttributeType: S
        - AttributeName: event_id
          AttributeType: S
      KeySchema:
        - AttributeName: matter_id
          KeyType: HASH
        - AttributeName: event_id
          KeyType: RANGE

  ProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EvidenceLedgerProcessor
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadIncomingObjects
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${EvidenceBucket.Arn}/incoming/*"
              - Sid: WriteAndQueryCustody
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource: !GetAtt CustodyTable.Arn
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-processor:*"

  Processor:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-processor"
      CodeUri: ../src
      Handler: evidence_ledger.aws_handler.handler
      Runtime: python3.13
      MemorySize: 256
      Timeout: 15
      Role: !GetAtt ProcessorRole.Arn
      Environment:
        Variables:
          EVIDENCE_BUCKET: !Ref EvidenceBucket
          CUSTODY_TABLE: !Ref CustodyTable

  ProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-processor"
      RetentionInDays: 1

Outputs:
  EvidenceBucketName:
    Value: !Ref EvidenceBucket
  CustodyTableName:
    Value: !Ref CustodyTable
  ProcessorFunctionName:
    Value: !Ref Processor
